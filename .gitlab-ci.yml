# Pipeline GitLab CI/CD para Laravel 13 + Starter Kit
image: edbizarro/gitlab-ci-pipeline-php:8.3

# Regras de workflow para economizar minutos de pipeline
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# Cache para acelerar a pipeline (preserva vendor e node_modules entre execucoes)
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/

variables:
  # Configuracoes para testes rapidos (SQLite em memoria)
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"
  NODE_ENV: production

stages:
  - build
  - lint
  - analyze
  - test
  - deploy

# --------------------------------------------------------------------------
# ESTAGIO: BUILD
# Instala dependencias e compila o frontend (Vite)
# --------------------------------------------------------------------------
build:
  stage: build
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - npm install
    - npm run build
  artifacts:
    paths:
      - vendor/
      - node_modules/
      - public/build/
    expire_in: 2 hours

# --------------------------------------------------------------------------
# ESTAGIO: LINT
# Garante que o codigo esta formatado corretamente (Laravel Pint)
# --------------------------------------------------------------------------
linting:
  stage: lint
  needs: ["build"]
  script:
    - composer lint:check

# --------------------------------------------------------------------------
# ESTAGIO: ANALYZE
# Analise Estatica Profunda (PHPStan Nivel 9)
# --------------------------------------------------------------------------
analysis:
  stage: analyze
  needs: ["build"]
  script:
    - composer phpstan

# --------------------------------------------------------------------------
# ESTAGIO: TEST
# Execucao dos Testes Automatizados (Pest 4)
# --------------------------------------------------------------------------
testing:
  stage: test
  needs: ["build"]
  script:
    - cp .env.example .env
    - php artisan key:generate
    - composer test

# --------------------------------------------------------------------------
# ESTAGIO: DEPLOY
# --------------------------------------------------------------------------
production:
  stage: deploy
  script:
    - echo "Deploy para producao (exemplo)"
  environment:
    name: production
    url: http://meu-projeto.com
  when: manual
  only:
    - main
